<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamScout</title><link rel="stylesheet" href="launcher.css"><script src="config.js" defer></script><script src="launcher.js" defer></script></head><body><main><p class="brand">STREAMSCOUT / TV</p><h1>Your watching space.<br>On the big screen.</h1><p class="intro">Connect to your StreamScout server. Your channels, teams and streams stay on your server.</p><form id="setup"><label for="server">Server address</label><input id="server" type="url" placeholder="http://192.168.1.100:8000" autocomplete="off" required><div class="actions"><button id="connect" type="submit">Connect & watch</button><button id="forget" type="button">Forget server</button></div></form><p id="status" role="status" aria-live="polite"></p><p class="hint">Use the pointer or arrow keys and OK. Keep your server on your trusted network.</p></main></body></html>
